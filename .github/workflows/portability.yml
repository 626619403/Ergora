name: Portability

on:
  push:
    branches: ["feat/windows-support", "feat/evolution-console", "main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')[dev,web,gepa,temporal]"
      - name: Packaged reference identity
        run: python -m ergora reference verify
      - name: Native application regression
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests',
              'src/ergora/data/reference/platform/upstream/platform/tests/test_contracts.py',
              'src/ergora/data/reference/platform/upstream/platform/tests/test_portable.py'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8')
          print(result.stdout, flush=True)
          if result.returncode:
              details = result.stdout[-50000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native regression::{details}', flush=True)
          raise SystemExit(result.returncode)
      - name: Windows PowerShell 5.1 installer and upgrade
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: |
          try { .\tests\windows-installation.ps1 }
          catch {
            $details = ($_ | Out-String) + $_.ScriptStackTrace
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer::$details"
            throw
          }
