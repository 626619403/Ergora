name: Portability

on:
  push:
    branches: ["feat/windows-support", "feat/evolution-console", "refactor/**", "main", "master"]
    paths-ignore: ["docs/**.md", "README.md", "AGENTS.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: groups
        name: Read explicit test groups
        shell: python
        run: |
          import json, os
          from pathlib import Path
          groups = json.loads(Path('scripts/ci/linux-groups.json').read_text())['linux_groups']
          if not groups:
              raise ValueError('Configure at least one Linux test group')
          include = [{'os': 'ubuntu-latest', 'python': '3.11', 'group': str(index)}
                     for index in range(len(groups))]
          include.append({'os': 'windows-latest', 'python': '3.12', 'group': 'all'})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('matrix=' + json.dumps({'include': include}) + '\n')
  native:
    needs: plan
    name: Native (${{ matrix.os }}, ${{ matrix.python }}, group ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')[dev,web,gepa,temporal,task-mcp]"
      - name: Packaged reference identity
        run: python -m ergora reference verify
      - name: Native application regression
        run: python scripts/ci/run.py --group ${{ matrix.group }} --output ci-results
      - name: Windows PowerShell 5.1 installer and upgrade
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: |
          try { .\tests\windows-installation.ps1 }
          catch {
            $details = ($_ | Out-String) + $_.ScriptStackTrace
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer::$details"
            throw
          }
      - name: Upload regression observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.group }}
          path: ci-results/
          if-no-files-found: warn
