[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ergora"
version = "0.2.0"
description = "Project contracts and evidence for multi-agent delivery and continuous improvement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
ergora = "ergora.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "httpx>=0.28,<0.29"]
gepa = ["gepa==0.1.4"]
temporal = ["temporalio==1.34.0"]
web = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ergora"]
include-package-data = false

[tool.setuptools.package-data]
ergora = ["data/**/*", "data/**/.*"]

[tool.setuptools.exclude-package-data]
ergora = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
